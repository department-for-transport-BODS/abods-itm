name: Ruff
on: [pull_request]
permissions: read-all
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # 6.0.3
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # 4.0.0
        name: "lint"
        with:
          version: "0.13.0"
          args: "check"
      - uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # 4.0.0
        name: "format"
        with:
          version: "0.13.0"
          args: "format --check"
