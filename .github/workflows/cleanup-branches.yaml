name: cleanup branches
on:
  schedule:
    - cron: "0 0 * * *"
permissions: read-all

jobs:
  remove-stale-branches:
    name: remove stale branches
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: fpicalausa/remove-stale-branches@9b829bc2975ade0c61e64e9613def53ec0732440 # 2.6.1
        with:
          dry-run: false
          days-before-branch-stale: 60
          exempt-branches-regex: ^(sandbox|dev|test|main)$
          exempt-protected-branches: true
          ignore-branches-with-open-prs: true
          ignore-unknown-authors: true
          operations-per-run: 100
          default-recipient: '@department-for-transport-BODS/Development'
