[tool.ruff]
# Enable all rules, then selectively disable specific rules.
lint.select = ["ALL"]
lint.ignore = [
    "E501",
    "D100",
    "D103",
    "D203",
    "D212",
    "D400",
    "D415",
    "G004",
    "TRY003",
    "EM101",
    "ANN101",
    "ANN102",
    "RET504",
    "S101",
    "TID252",
    "PTH123",
    "DTZ005",
    "PLR0913"
]
lint.fixable = [
    "A",
    "C",
    "D",
    "E",
    "F",
    "G",
    "I",
    "N",
    "Q",
    "S",
    "T",
    "W",
    "ANN",
    "ARG",
    "BLE",
    "COM",
    "DJ",
    "DTZ",
    "EM",
    "ERA",
    "EXE",
    "FBT",
    "ICN",
    "INP",
    "ISC",
    "NPY",
    "PD",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "SLF",
    "TCH",
    "TID",
    "TRY",
    "UP",
    "YTT",
]
lint.unfixable = ["B", "F841"]
target-version = "py311"
exclude = [".aws-sam"]
lint.extend-select = ["I", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "D100", "D101", "D102", "D103", "D104"]
"__about__.py" = ["E402", "D100", "D101", "D102", "D103", "D104"]
"**/{tests,docs}/*" = ["E402", "INP001", "T201", "ANN001", "ANN201", "PLR2004"]

[tool.ruff.lint.isort]
case-sensitive = true
