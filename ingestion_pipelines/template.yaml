AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  This SAM template deploys resources associated with the backend ITM process for the (Analyse Bus Open Data) service

Globals:
  Function:
    Architectures:
      - x86_64
    Runtime: python3.11
    Timeout: 400
    MemorySize: 2048

Parameters:
  Environment:
    Type: String
    Description: The environment into which the stack is being deployed
  ProjectName:
    Description: The name of the project
    Default: 'abods'
    Type: String
  RdsDbHostAddr:
    Type: String
    Default: ''
  RdsDbPort:
    Type: Number
    Default: 5432
  VpcId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Default: ''
  VpcSubnets:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: ''

Conditions:
  IsNotLocal: !Not [!Equals [!Ref Environment, 'local']]
  IsSandbox: !Equals [!Ref Environment, 'sandbox']

Resources:
  ##########################################################
  #### SIRIVM S3 INGESTION FUNCTION (& ASSC. RESOURCES) ####
  ##########################################################
  SiriVmS3IngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sirivm-s3-ingestion-function'
      ReservedConcurrentExecutions: 1
      CodeUri: ./sirivm_s3_ingestion_function
      Handler: sirivm_s3_ingestion_function.app.lambda_handler
      KmsKeyArn: !If 
        - IsNotLocal
        - !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/lambda/arn}}'
        - !Ref AWS::NoValue
      Layers: !If
        - IsNotLocal
        - - !Ref IngestionFunctionLayer
        - []
      Policies:
        - 'AWSLambdaVPCAccessExecutionRole'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/rds_proxy_rw_policy/arn}}'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/sirivm_access_policy/arn}}'
        - S3CrudPolicy:
            BucketName: !Ref ProcessBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt SiriVmIngestionQueue.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmProcessQueue.QueueName
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - 'sqs:GetQueueUrl'
            Resource: !GetAtt SiriVmProcessQueue.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue1.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue2.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue3.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue4.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue5.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue6.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue7.QueueName
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - 'sqs:GetQueueUrl'
              - 'sqs:SendMessage*'
            Resource: 
              - !GetAtt SiriVmOtpMatchingQueue1.Arn
              - !GetAtt SiriVmOtpMatchingQueue2.Arn
              - !GetAtt SiriVmOtpMatchingQueue3.Arn
              - !GetAtt SiriVmOtpMatchingQueue4.Arn
              - !GetAtt SiriVmOtpMatchingQueue5.Arn
              - !GetAtt SiriVmOtpMatchingQueue6.Arn
              - !GetAtt SiriVmOtpMatchingQueue7.Arn
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt SiriVmS3IngestionFunctionLogGroup.Arn
      Events:
        SQSTemplateTriggerEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt SiriVmIngestionQueue.Arn
            BatchSize: 1
      VpcConfig:
        SubnetIds: !Ref VpcSubnets
        SecurityGroupIds:
          - !GetAtt SiriVmS3IngestionFunctionSecurityGroup.GroupId
          - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/ec2/securitygroup/rdsproxy-access/id}}'
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: sirivm_s3_ingestion_function
          POWERTOOLS_LOG_LEVEL: INFO
          PROJECT_ENV: !Ref Environment
          PROJECT_NAME: !Ref ProjectName
          POSTGRES_HOST: !If
            - IsNotLocal
            - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rdsproxy/endpoint}}'
            - !Ref RdsDbHostAddr
          POSTGRES_PORT: !Ref RdsDbPort
          POSTGRES_DB: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rds/dbname}}'
          POSTGRES_USER: !Sub '${ProjectName}_proxy_rw'
          SIRIVM_BUCKET: !If
            - IsNotLocal
            - !Ref ProcessBucket
            - !Ref AWS::NoValue
          SIRIVM_PROCESS_QUEUE: !If
            - IsNotLocal
            - !GetAtt SiriVmProcessQueue.QueueName
            - []
          SIRIVM_OTP_QUEUE1: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue1.QueueName
            - []
          SIRIVM_OTP_QUEUE2: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue2.QueueName
            - []
          SIRIVM_OTP_QUEUE3: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue3.QueueName
            - []
          SIRIVM_OTP_QUEUE4: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue4.QueueName
            - []
          SIRIVM_OTP_QUEUE5: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue5.QueueName
            - []
          SIRIVM_OTP_QUEUE6: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue6.QueueName
            - []
          SIRIVM_OTP_QUEUE7: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue7.QueueName
            - []
      LoggingConfig:
        LogGroup: !Ref SiriVmS3IngestionFunctionLogGroup

  SiriVmS3IngestionFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName}-${Environment}-sirivm-s3-ingestion-function'
      GroupName: !Sub '${ProjectName}-${Environment}-sirivm-s3-ingestion-function'
      SecurityGroupEgress: 
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-sirivm-s3-ingestion-function'

  SiriVmS3IngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotLocal
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-sirivm-s3-ingestion-function'
      KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/cloudwatch/arn}}'
      RetentionInDays: 30

  ##########################################################
  #### SIRIVM DB INGESTION FUNCTION (& ASSC. RESOURCES) ####
  ##########################################################
  SiriVmDbIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sirivm-db-ingestion-function'
      CodeUri: ./sirivm_db_ingestion_function
      Handler: sirivm_db_ingestion_function.app.lambda_handler
      Layers: !If
        - IsNotLocal
        - - !Ref IngestionFunctionLayer
        - []
      Policies:
        - 'AWSLambdaVPCAccessExecutionRole'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/rds_proxy_rw_policy/arn}}'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/sirivm_access_policy/arn}}'
        - S3CrudPolicy:
            BucketName: !Ref ProcessBucket
        - SQSPollerPolicy:
            QueueName: !GetAtt SiriVmProcessQueue.QueueName
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - 'sqs:GetQueueUrl'
            Resource: !GetAtt SiriVmProcessQueue.Arn
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt SiriVmDbIngestionFunctionLogGroup.Arn
      Events:
        SQSTemplateTriggerEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt SiriVmProcessQueue.Arn
            BatchSize: 1
            ScalingConfig:
              MaximumConcurrency: 2
      VpcConfig:
        SubnetIds: !Ref VpcSubnets
        SecurityGroupIds:
          - !GetAtt SiriVmDbIngestionFunctionSecurityGroup.GroupId
          - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/ec2/securitygroup/rdsproxy-access/id}}'
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: sirivm_db_ingestion_function
          POWERTOOLS_LOG_LEVEL: INFO
          PROJECT_ENV: !Ref Environment
          PROJECT_NAME: !Ref ProjectName
          POSTGRES_HOST: !If
            - IsNotLocal
            - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rdsproxy/endpoint}}'
            - !Ref RdsDbHostAddr
          POSTGRES_PORT: !Ref RdsDbPort
          POSTGRES_DB: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rds/dbname}}'
          POSTGRES_USER: !Sub '${ProjectName}_proxy_rw'
          SIRIVM_BUCKET: !If
            - IsNotLocal
            - !Ref ProcessBucket
            - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref SiriVmDbIngestionFunctionLogGroup

  SiriVmDbIngestionFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName}-${Environment}-sirivm-db-ingestion-function'
      GroupName: !Sub '${ProjectName}-${Environment}-sirivm-db-ingestion-function'
      SecurityGroupEgress: 
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-sirivm-db-ingestion-function'

  SiriVmDbIngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotLocal
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-sirivm-db-ingestion-function'
      KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/cloudwatch/arn}}'
      RetentionInDays: 30

  #####################################################################
  #### SIRIVM TIMETABLE S3 GENERATION FUNCTION (& ASSC. RESOURCES) ####
  #####################################################################
  SiriVmTimetableS3GenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sirivm-timetable-s3-generation-function'
      CodeUri: ./sirivm_timetable_s3_generation_function
      Handler: sirivm_timetable_s3_generation_function.app.lambda_handler
      Timeout: 900
      MemorySize: 5000
      Layers: !If
        - IsNotLocal
        - - !Ref IngestionFunctionLayer
          - "arn:aws:lambda:eu-west-2:336392948345:layer:AWSSDKPandas-Python311:12"
        - []
      Policies:
        - 'AWSLambdaVPCAccessExecutionRole'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/rds_proxy_rw_policy/arn}}'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/sirivm_access_policy/arn}}'
        - S3CrudPolicy:
            BucketName: !Ref ProcessBucket
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt SiriVmTimetableS3GenerationFunctionLogGroup.Arn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue1.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue2.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue3.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue4.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue5.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue6.QueueName
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SiriVmOtpMatchingQueue7.QueueName
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - 'sqs:GetQueueUrl'
              - 'sqs:SendMessage*'
            Resource: 
              - !GetAtt SiriVmOtpMatchingQueue1.Arn
              - !GetAtt SiriVmOtpMatchingQueue2.Arn
              - !GetAtt SiriVmOtpMatchingQueue3.Arn
              - !GetAtt SiriVmOtpMatchingQueue4.Arn
              - !GetAtt SiriVmOtpMatchingQueue5.Arn
              - !GetAtt SiriVmOtpMatchingQueue6.Arn
              - !GetAtt SiriVmOtpMatchingQueue7.Arn
      Events:
        EventName:
          Type: Schedule
          Properties:
            Schedule: cron(0/30 * * * ? *)      
      VpcConfig:
        SubnetIds: !Ref VpcSubnets
        SecurityGroupIds:
          - !GetAtt SiriVmTimetableS3GenerationFunctionSecurityGroup.GroupId
          - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/ec2/securitygroup/rdsproxy-access/id}}'
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: sirivm_timetable_s3_generation_function
          POWERTOOLS_LOG_LEVEL: INFO
          PROJECT_ENV: !Ref Environment
          PROJECT_NAME: !Ref ProjectName
          POSTGRES_HOST: !If
            - IsNotLocal
            - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rdsproxy/endpoint}}'
            - !Ref RdsDbHostAddr
          POSTGRES_PORT: !Ref RdsDbPort
          POSTGRES_DB: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rds/dbname}}'
          POSTGRES_USER: !Sub '${ProjectName}_proxy_rw'
          SIRIVM_BUCKET: !If
            - IsNotLocal
            - !Ref ProcessBucket
            - !Ref AWS::NoValue
          SIRIVM_OTP_QUEUE1: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue1.QueueName
            - []
          SIRIVM_OTP_QUEUE2: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue2.QueueName
            - []
          SIRIVM_OTP_QUEUE3: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue3.QueueName
            - []
          SIRIVM_OTP_QUEUE4: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue4.QueueName
            - []
          SIRIVM_OTP_QUEUE5: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue5.QueueName
            - []
          SIRIVM_OTP_QUEUE6: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue6.QueueName
            - []
          SIRIVM_OTP_QUEUE7: !If
            - IsNotLocal
            - !GetAtt SiriVmOtpMatchingQueue7.QueueName
            - []
      LoggingConfig:
        LogGroup: !Ref SiriVmTimetableS3GenerationFunctionLogGroup

  SiriVmTimetableS3GenerationFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName}-${Environment}-sirivm-timetable-s3-generation-function'
      GroupName: !Sub '${ProjectName}-${Environment}-sirivm-timetable-s3-generation-function'
      SecurityGroupEgress: 
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-sirivm-timetable-s3-generation-function'

  SiriVmTimetableS3GenerationFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotLocal
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-sirivm-timetable-s3-generation-function'
      KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/cloudwatch/arn}}'
      RetentionInDays: 30

  #############################################################
  #### TRAVELINE DB INGESTION FUNCTION (& ASSC. RESOURCES) ####
  #############################################################
  TravelineDbIngestionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-traveline-db-ingestion-function'
      CodeUri: ./traveline_import_function
      Handler: traveline_import_function.app.lambda_handler
      Timeout: 60
      MemorySize: 512
      Layers: !If
        - IsNotLocal
        - - !Ref IngestionFunctionLayer
        - []
      Policies:
        - 'AWSLambdaVPCAccessExecutionRole'
        - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/iam/rds_proxy_rw_policy/arn}}'
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt TravelineDbIngestionFunctionLogGroup.Arn
      Events:
        TravelineSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(07 01 * * ? *)
            Name: !Sub 'TravelineSchedule${Environment}'
            Description: Traveline schedule
            Enabled: true
      VpcConfig:
        SubnetIds: !Ref VpcSubnets
        SecurityGroupIds:
          - !GetAtt TravelineDbIngestionFunctionSecurityGroup.GroupId
          - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/ec2/securitygroup/rdsproxy-access/id}}'
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: traveline_import_function
          POWERTOOLS_LOG_LEVEL: INFO
          PROJECT_ENV: !Ref Environment
          PROJECT_NAME: !Ref ProjectName
          POSTGRES_HOST: !If
            - IsNotLocal
            - !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rdsproxy/endpoint}}'
            - !Ref RdsDbHostAddr
          POSTGRES_PORT: !Ref RdsDbPort
          POSTGRES_DB: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/rds/dbname}}'
          POSTGRES_USER: !Sub '${ProjectName}_proxy_rw'
      LoggingConfig:
        LogGroup: !Ref TravelineDbIngestionFunctionLogGroup

  TravelineDbIngestionFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ProjectName}-${Environment}-traveline-db-ingestion-function'
      GroupName: !Sub '${ProjectName}-${Environment}-traveline-db-ingestion-function'
      SecurityGroupEgress: 
        - IpProtocol: '-1'
          CidrIp: '0.0.0.0/0'
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-traveline-db-ingestion-function'

  TravelineDbIngestionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotLocal
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-traveline-db-ingestion-function'
      KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/cloudwatch/arn}}'
      RetentionInDays: 30

  ##########################################################
  #### CONVERT TO PARQUET FUNCTION (& ASSC. RESOURCES) #####
  ##########################################################
  ConvertToParquetFunction:
    Type: AWS::Serverless::Function
    Properties:
      # checkov:skip=CKV_AWS_117:No need to run in a vpc, only accesses AWS API
      FunctionName: !Sub '${ProjectName}-${Environment}-convert-to-parquet-function'
      CodeUri: ./convert_to_parquet_function
      Handler: convert_to_parquet_function.app.lambda_handler
      Timeout: 600
      MemorySize: 5000
      Layers: !If
        - IsNotLocal
        - - !Ref IngestionFunctionLayer
        - []
      Policies:
        - KMSDecryptPolicy:
            KeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/s3/arn}}'
        - S3CrudPolicy:
            BucketName: !Ref ExporterBucket
        - Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt ConvertToParquetFunctionLogGroup.Arn
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: convert_to_parquet_function
          POWERTOOLS_LOG_LEVEL: INFO
          PROJECT_ENV: !Ref Environment
          PROJECT_NAME: !Ref ProjectName
          EXPORTER_BUCKET: !If
            - IsNotLocal
            - !Ref ExporterBucket
            - !Ref AWS::NoValue
      LoggingConfig:
        LogGroup: !Ref ConvertToParquetFunctionLogGroup

  ConvertToParquetFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsNotLocal
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-${Environment}-convert-to-parquet-function'
      KmsKeyId: !Sub '{{resolve:ssm:/${ProjectName}/shared/kms/cloudwatch/arn}}'
      RetentionInDays: 30

  #########################################
  #### GENERAL CONFIGURATION RESOURCES ####
  #########################################
  IngestionFunctionLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${ProjectName}-${Environment}-ingestion-layer'
      ContentUri: ./ingestion_layer
      CompatibleRuntimes:
        - python3.11
    Metadata:
      BuildMethod: python3.11

  SnsSubscriptionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${Environment}-sns-subscription-function'
      CodeUri: ./sns_subscription_function
      Handler: sns_subscription_function.app.lambda_handler
      Timeout: 90
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - 'sqs:ReceiveMessage'
                - 'sqs:DeleteMessage'
                - 'sqs:GetQueueAttributes'
              Resource: !GetAtt SiriVmIngestionQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - 'sns:Subscribe'
                - 'sns:Unsubscribe'
                - 'sns:ConfirmSubscription'
                - 'sns:ListSubscriptionsByTopic'
              Resource: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/sns/avl-topic/arn}}'
      Environment:
        Variables:
          # checkov:skip=CKV_AWS_173:These env vars don't need to be encrypted
          POWERTOOLS_SERVICE_NAME: sns_subscription_function
          POWERTOOLS_LOG_LEVEL: INFO

  SnsSubscriptionCustomResource:
    Type: Custom::SNSSubscription
    Properties:
      ServiceToken: !GetAtt SnsSubscriptionFunction.Arn
      SnsTopicArn: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/sns/avl-topic/arn}}'
      SqsQueueArn: !GetAtt SiriVmIngestionQueue.Arn
      SqsQueueUrl: !GetAtt SiriVmIngestionQueue.QueueUrl

  ProcessBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Condition: IsNotLocal
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-process-bucket'

  ExporterBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Condition: IsNotLocal
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-exporter-bucket'

  SiriVmIngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-sirivm-ingestion-queue.fifo'
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 430

  SiriVmIngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SiriVmIngestionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SiriVmIngestionQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:aws:s3:::${ProjectName}-${Environment}-landing-bucket'
          - Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SiriVmIngestionQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub '{{resolve:ssm:/${ProjectName}/${Environment}/sns/avl-topic/arn}}'

  SiriVmProcessQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-sirivm-process-queue'
      VisibilityTimeout: 430

  ####################################################################
  #### SIRIVM OTP PARALLEL MATCHING FUNCTIONS (& ASSC. RESOURCES) ####
  ####################################################################

  SiriVmOtpMatchingQueue1:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-sirivm-otp-queue1.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 430

  SiriVmOtpMatchingQueue2:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${ProjectName}-${Environment}-sirivm-otp-queue2.fifo'
