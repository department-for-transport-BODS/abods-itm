[tools]
python = "3.11"

[settings]
experimental = true

[tasks.fmt]
run = "ruff format"

[tasks."fmt:check"]
run = "ruff format --check --diff"

[tasks.test]
run = "pytest"

[tasks.checkov]
run = "checkov --baseline .checkov.baseline -d . --skip-path ./venv"

[tasks.checks]
depends = ["checkov", "test", "fmt:check"]


