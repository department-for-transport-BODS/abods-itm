[settings]
experimental = true
asdf_compat = true

[tasks.install]
dir = "ingestion_pipelines"
run = "pip install -r requirements.dev.txt"

[tasks.fmt]
run = "ruff format"

[tasks."fmt:check"]
run = "ruff format --check --diff"

[tasks."lint"]
run = "ruff check --fix ."

[tasks."lint:check"]
run = "ruff check ."

[tasks.test]
run = "pytest"

[tasks.checkov]
run = "checkov --baseline .checkov.baseline -d . --skip-path ./venv"

[tasks.fix]
depends = ["fmt", "lint"]

[tasks.checks]
depends = ["checkov", "test", "fmt:check", "lint:check"]


